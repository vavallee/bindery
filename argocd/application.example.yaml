# Example ArgoCD Application for Bindery.
#
# This is a template, not a live deployment. Nothing applies or syncs this
# file. Copy it into your own GitOps repo (for example an app of apps
# directory), replace the placeholder host, NFS server and path with your own
# values, and pick the project and namespace you want.
#
# Prefer a dedicated namespace and AppProject over `default`: changing the
# destination namespace of an existing Application later recreates every
# resource, including the config PVC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bindery
  namespace: argocd
  labels:
    app.kubernetes.io/name: bindery
spec:
  project: default
  source:
    repoURL: https://github.com/vavallee/bindery
    # Track a release tag (for example v1.2.3) for a pinned install, or main
    # to follow every release.
    targetRevision: main
    path: charts/bindery
    helm:
      valueFiles:
        - values.yaml
      # Cluster specific overlay. values.yaml is neutral (ingress off,
      # example host) so the chart stays reusable; set your own values here.
      values: |
        # The chart defaults for entryPoints, certResolver and storageClass
        # are the maintainer's cluster names, so set what you need explicitly.
        ingress:
          enabled: true
          # "standard" renders a plain networking.k8s.io/v1 Ingress that works
          # with any ingress controller. The default type "traefik" renders an
          # IngressRoute that carries a hardcoded `traefik-internal` ingress
          # class annotation, so Traefik would have to be configured to watch
          # that class. If you want it anyway, set type: traefik and also set
          # entryPoints (for example websecure) and certResolver to your names.
          type: standard
          className: traefik   # your IngressClass name, for example nginx
          host: bindery.example.com
          tls:
            - secretName: bindery-tls
              hosts: [bindery.example.com]
        persistence:
          config:
            # Empty uses the cluster default StorageClass; or name one.
            storageClass: ""
        nfs:
          enabled: true
          server: nfs.example.lan
          path: /path/to/media
  destination:
    server: https://kubernetes.default.svc
    namespace: bindery
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
