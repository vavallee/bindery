name: OpenSSF Scorecard

# Separate workflow: Scorecard requires its own minimal permissions and
# a separate schedule (one hour after security.yml to avoid rate-limit
# contention on the GitHub API).
#
# See: https://github.com/ossf/scorecard-action#permissions
on:
  schedule:
    # Weekly Monday 07:00 UTC — one hour after security.yml (06:00)
    - cron: '0 7 * * 1'
  push:
    branches: [main]

# Top-level permissions must be read-only — the Scorecard publish API
# rejects results from workflows that declare any global write permission.
permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write  # upload SARIF to the Security tab
      id-token: write         # Sigstore OIDC signing for publish_results
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publish results to scorecard.dev public dashboard
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: scorecard.sarif
          category: ossf-scorecard
