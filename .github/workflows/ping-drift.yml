name: Ping Server drift

# api.getbindery.dev runs from a private infrastructure repo, synced by ArgoCD
# with selfHeal. This repo cannot see, read or change what is deployed. It can
# see what the running server says it is, and what the newest build from this
# tree would be, and it can say when those part company.
#
# That gap ran to 41 days once. The service served an end of life Debian 12
# base with two High advisories for weeks after #2425 fixed it here, because
# nothing pulled the image forward and nothing was watching. It surfaced only
# because someone went looking in pod logs for the new_install line from #2155
# and could not find it.
#
# This cannot deploy. It makes the gap visible the morning it opens.

on:
  schedule:
    - cron: "41 6 * * *" # daily, off-hour and off-minute to dodge runner contention
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Compare the running build against this tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `git log -- <path>` needs history; the default shallow clone has none.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: true

      # "the newest commit that would have produced an image" is git's
      # question, not the tool's, so it is answered here in one command and
      # everything worth testing stays in tools/pingdrift.
      - name: Work out the newest bindery-ping build in this tree
        id: expected
        run: |
          set -euo pipefail
          SHA=$(git log -1 --format=%H -- cmd/telemetry-server)
          if [ -z "$SHA" ]; then
            echo "::error::no commit found touching cmd/telemetry-server, so there is nothing to compare against"
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "newest bindery-ping build in this tree: ${SHA}"

      - name: Compare the running build against it
        env:
          PING_EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
          TELEMETRY_STATS_TOKEN: ${{ secrets.TELEMETRY_STATS_TOKEN }}
        run: go run ./tools/pingdrift
