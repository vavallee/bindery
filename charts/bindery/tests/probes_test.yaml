suite: probes
templates:
  - deployment.yaml

tests:
  - it: readiness checks the database route
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/v1/health/ready
      # The handler spends up to 2 s on the database; the kubelet's default
      # 1 s timeout would fail the probe before the handler answers.
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3

  - it: liveness stays on the static health route
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /api/v1/health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket.port
          value: http
